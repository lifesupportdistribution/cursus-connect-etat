# Cursus Connect — relevé d'état de la PRODUCTION, toutes les 15 minutes.
#
# Pourquoi ce dépôt est PUBLIC : les minutes GitHub Actions sont facturées sur un
# dépôt privé et gratuites sur un dépôt public. Une sonde au quart d'heure
# consomme ~2 900 minutes par mois — impossible dans l'enveloppe incluse d'un
# compte gratuit. Ici, elle ne coûte rien. Ce dépôt ne contient donc AUCUN code
# applicatif et AUCUN secret : une sonde qui interroge une page publique n'en a
# pas besoin, et c'est précisément ce qui permet de le rendre public.
#
# Deux effets, pas un :
#   - le relevé est écrit dans public/historique.json et poussé ici. C'est
#     l'historique que lit la page d'état ; versionné, il ne s'efface jamais,
#     contrairement aux exécutions GitHub (90 jours).
#   - si la production est en panne, ce workflow ÉCHOUE, et GitHub envoie un
#     e-mail au propriétaire du dépôt. C'est l'alerte, et elle ne demande rien à
#     configurer. (Vérifier une fois : Settings → Notifications → Actions.)
#
# L'ordre des étapes n'est pas décoratif : on enregistre le relevé AVANT de
# signaler la panne. Une panne dont on ne garde pas la trace est une panne qu'on
# ne pourra pas expliquer au client la semaine suivante.
#
# Le cron ci-dessous ne suffit pas : le planificateur de GitHub abandonne la
# plupart de ses passages (6 a 7 par jour constates le 19.09.2026 au lieu de
# 96). Le Worker Cloudflare cursus-connect-vigie demande donc un releve
# par workflow_dispatch tous les quarts d'heure. Le cron reste en filet et
# sert de chien de garde : si plus de 60 min separent deux releves, la
# derniere etape echoue et GitHub envoie l'e-mail.
name: releve

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Deux relevés simultanés se disputeraient la poussée : on les met à la queue.
concurrency:
  group: releve
  cancel-in-progress: false

jobs:
  relever:
    runs-on: ubuntu-24.04   # epingle : ubuntu-latest passe a Ubuntu 26 le 19.10.2026
    timeout-minutes: 10
    env:
      RELEVE_FICHIER: /tmp/releve-mesure.json   # le relevé mesuré, pour le rejouer s'il est devancé (runner : hors du dépôt)
    steps:
      # [module 2, 21.10.2026] La TÊTE de la branche au démarrage du travail, et non le commit du
      # déclenchement : un passage mis en file derrière un autre part du relevé que celui-ci vient
      # de pousser (sans ref, il repartait de l'historique d'AVANT et son relevé pouvait se perdre).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Relever l'état de la production
        id: releve
        continue-on-error: true      # on enregistre le relevé MÊME (surtout) en panne
        run: node scripts/relever.mjs

      - name: Publier le relevé
        run: |
          git config user.name  "sonde"
          git config user.email "actions@github.com"
          git add public/historique.json
          if git diff --cached --quiet; then
            echo "rien de neuf à publier"
          else
            # [CF-Pages-Skip] en tete : Cloudflare Pages ne reconstruit pas la page pour un
            # simple releve (500 constructions/mois en offre gratuite, 96 releves/jour).
            git commit -q -m "[CF-Pages-Skip] relevé $(date -u '+%Y-%m-%d %H:%M UTC')"
            # [module 2] Un relevé concurrent a pu passer devant : on repart de SA tête et on
            # rejoue CE relevé par-dessus (REJOUER=1, sans sonder de nouveau). Jamais de poussée
            # d'un historique qui ne contiendrait pas le relevé ; trois essais, puis l'échec dit.
            for essai in 1 2 3; do
              if git push -q origin "HEAD:${GITHUB_REF_NAME}"; then echo "relevé publié (essai $essai)"; exit 0; fi
              echo "poussée devancée (essai $essai) : relevé rejoué sur la tête de branche"
              git fetch -q origin "${GITHUB_REF_NAME}"
              git reset -q --hard "origin/${GITHUB_REF_NAME}"
              REJOUER=1 node scripts/relever.mjs
              git add public/historique.json
              git diff --cached --quiet && { echo "relevé déjà présent"; exit 0; }
              git commit -q -m "[CF-Pages-Skip] relevé $(date -u '+%Y-%m-%d %H:%M UTC') (rejoué)"
            done
            echo "::error::Relevé non publié après trois essais : trois relevés concurrents l'ont devancé."
            exit 1
          fi

      - name: Signaler la panne (c'est cet échec qui envoie l'e-mail)
        if: steps.releve.outcome == 'failure'
        run: |
          echo "::error::La production ne répond pas normalement — voir l'étape « Relever »."
          exit 1

      - name: Signaler le declencheur muet (plus de 60 min entre deux releves)
        if: ${{ !cancelled() && fromJSON(steps.releve.outputs.ecart_min || '0') > 60 }}
        run: |
          echo "::error::Declencheur muet : ${{ steps.releve.outputs.ecart_min }} min depuis le releve precedent (attendu 15). Verifier le Worker cursus-connect-vigie et son jeton GITHUB_JETON."
          exit 1
